[project]
name = "xihe-agent"
version = "1.0.0"
description = "XiheAgent (羲和) - A powerful AI-powered coding assistant built with FastAPI and LangGraph"
authors = [
    { name = "Apolleo", email = "ZGonce819@foxmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    
    # LangGraph & DeepAgents
    "deepagents>=0.1.0",
    "langchain>=1.0.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-redis>=0.1.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "cryptography>=41.0.0",  # Required by pymysql for MySQL 8+ authentication
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    
    # HTTP & Utilities
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",  # For async HTTP requests (SSRF-safe)
    "python-dotenv>=1.0.0",  # Environment variable loading
    
    # Gitee integration
    "requests>=2.31.0",  # Gitee API calls
    
    # Sandbox
    "opensandbox>=0.1.0",  # Ali OpenSandbox SDK - Python client library
    "opensandbox-code-interpreter>=0.1.0",  # Code interpreter backend for sandbox
    "opensandbox-server>=0.1.0",  # Sandbox server component (enterprise deployment)
]

[project.optional-dependencies]
search = [
    "zhipuai>=2.0.0",  # 智谱 SDK，web_search 工具使用（不装则该工具调用会报错）
]
dev = [
    "ruff>=0.4.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
    "isort>=5.13.0",
    "import-linter>=2.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
xihe-agent-start = "scripts.start_all:main"
xihe-agent-stop = "scripts.stop_all:main"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "ARG", "SIM"]
ignore = ["E501"]  # Line length handled by ruff automatically

[tool.ruff.lint.isort]
# 本项目的顶层包直接位于仓库根目录（而非某个 src/xihe/ 下），
# 必须显式声明为 first-party，否则 isort 会把它们当第三方与 langgraph 等混排。
known-first-party = [
    "agent",
    "api",
    "backends",
    "config",
    "database",
    "models",
    "schemas",
    "scripts",
    "services",
    "store",
    "tools",
    "utils",
]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
# 测试里的假对象必须照抄真实签名（哪怕某个参数用不到），夹具也常只依赖副作用，
# 因此对 tests/ 放开「未使用参数」这一类规则。ARG002 是其中的「方法参数未使用」，
# 替身类照抄 `def get_thread(self, thread_id)` 就会命中它。
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
strict_optional = true

[tool.importlinter]
# 分层依赖契约：用可执行的规则固定包之间的依赖方向，
# 防止再次出现 utils ↔ agent 这类跨层反向依赖导致的循环导入。
# 运行方式：在项目根目录执行 `lint-imports`（由 import-linter 提供）。
# 仅类型注解（if TYPE_CHECKING 分支）的 import 不构成运行时依赖，不计入契约。
exclude_type_checking_imports = true
root_packages = [
    "agent",
    "api",
    "backends",
    "config",
    "database",
    "models",
    "schemas",
    "services",
    "store",
    "tools",
    "utils",
]

[[tool.importlinter.contracts]]
# utils 是最底层的基础工具包，被上层业务包广泛依赖。
# 它只能依赖 config 以及“依赖汇点”模块——即那些只依赖 config/第三方、
# 绝不会回指 utils 的模块，如 agent.graph.model、database.redis（仅依赖 config.app_config）。
# utils 绝不能反向 import 任何会（直接或间接）import utils 的上层业务包，否则成环。
name = "utils 基础层禁止反向依赖上层业务包"
type = "forbidden"
source_modules = ["utils"]
forbidden_modules = [
    "agent.memory",
    "agent.middleware",
    "agent.runtime",
    "agent.skills",
    "api",
    "backends",
    "models",
    "schemas",
    "services",
    "store",
    "tools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 顶层包直接位于仓库根（没有 src/ 或 xihe/ 这一层），所以这里必须逐个列出。
# 之前的 `include = ["xihe*"]` 匹配不到任何包，`pip install .` 会装出一个空壳。
include = [
    "agent*",
    "api*",
    "backends*",
    "config*",
    "database*",
    "models*",
    "schemas*",
    "scripts*",
    "services*",
    "store*",
    "tools*",
    "utils*",
]
# 只用于开发/评估，不随包发布。
exclude = ["tests*", "eval*", "data*", "logs*"]
